    <rect x="74" y="32" width="8" height="40" fill="#3a5568" stroke="#9ec0d8" stroke-width="1.5"/>
    <rect x="26" y="66" width="48" height="8" fill="#2a4050" stroke="#8ab0c8" stroke-width="1.5"/>
  </g>
  <g id="hold_opening">
