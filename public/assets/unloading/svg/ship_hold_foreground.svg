    <rect x="24" y="34" width="52" height="4" fill="#2a4050" opacity="0.6"/>
  </g>
  <g id="side_coamings">
    <rect x="18" y="30" width="6" height="48" fill="#4a6a80" fill-opacity="0.55" stroke="#a8c8e0" stroke-width="1.2"/>
    <rect x="76" y="30" width="6" height="48" fill="#4a6a80" fill-opacity="0.55" stroke="#a8c8e0" stroke-width="1.2"/>
  </g>
</svg>
